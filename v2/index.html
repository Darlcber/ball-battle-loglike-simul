  .mapsvg .me{stroke:#3a4170;stroke-width:2}.mapsvg .me.done{stroke:#8fa0ff;stroke-width:3}.mapsvg .me.hot{stroke:#7fe36a;stroke-width:3;stroke-dasharray:5 4}

<body>
<div id="top"><span id="hud"></span>

</div>

<div id="vault"></div><div id="bdlg"></div>
<script>
// ================= 기본 도구 =================
function rngOf(o){ return () => { let a = o.rs | 0; a = a + 0x6D2B79F5 | 0; o.rs = a; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }   // 상태를 o.rs에 두는 난수(저장 가능)
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const T = s => Math.round(s * 60);
const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
const W = 360, H = 400, R = 22, MAX_TICKS = 3600, OT_START = 900, OT_RAMP = 600, BIG = 1e9;
const SLASH_RANGE = 100, SLASH_HALF = 1.0, SLASH_DUR = 27;
const MINE_TRIGGER = 20, MINE_LIFE = 12, MINE_ARM = 30, NOVA_R = 95;
const ACT_LEN = 20, ACTS = 5, TOP_FLOOR = ACT_LEN * ACTS, MIN_INTERVAL = 3.5;   // 100층 = 5막, 막마다 20층에 보스
const MAX_SLOTS = 7;   // 문장 칸: 3칸에서 시작, 보스를 잡을 때마다 +1 (최대 7)
const actOf = f => Math.min(ACTS, Math.ceil(f / ACT_LEN));   // 몇 막인지

  for (const x of r.deck || []) if (x.type === "rule" && RULES[x.pre]) RULES[x.pre].fx(o, 1 + 0.5 * (x.lv || 0));   // 규칙형 문장

}
function giveRelicId(r, id){   // 특정 유물 지급 (이미 있으면 null)

}
function grantRelic(r, mode){   // mode: normal / elite(정예) / chest(보물상자)
  const pool = Object.keys(RELIC).filter(id => RELIC[id].tier !== "k" && !r.relics.some(x => x.id === id)); if (!pool.length) return null;   // 저주 유물은 이벤트로만

  return pick;
}

const potionSlotsOf = r => Math.max(1, 3 + relicFx(r).potionSlots);
function pickPotionId(r){ return pickByTier(Object.keys(POTION), id => POTION[id].tier, TIER_W.drop, r.rng); }
function grantPotion(r, id){   // 칸이 없으면 false
  if (r.potions.length >= potionSlotsOf(r)) return false;
  id = id || pickPotionId(r);
  r.potions.push(id); return id;
}
// 승리 후 물약 획득 판정 (못 얻으면 다음에 확률이 올라가고, 얻으면 내려감)
function rollPotionDrop(r, kind){
  const fx = relicFx(r), chance = r.potionChance + fx.dropBonus + (kind === "elite" ? 0.2 : 0);
  if (r.rng() < chance){
    r.potionChance = Math.max(0.1, r.potionChance - 0.1);
    const id = pickPotionId(r);
    return { id, kept: grantPotion(r, id) !== false };
  }
  r.potionChance = Math.min(0.8, r.potionChance + 0.1);
  return null;
}
// 전투 중 물약 사용: 효과 적용 후 [물약을 사용할 때] 문장 발동
const BREW_KEEP = 6;
function usePotion(s, r, idx, auto){
  const id = r.potions[idx]; if (!id || s.winner !== null) return null;
  r.potions.splice(idx, 1); return applyPotion(s, r, id, auto);
}
function applyPotion(s, r, id, auto){   // 물약 효과 + [물약을 사용할 때] 문장. auto = 문장(물약 마시기·제조)으로 마심
  const P = s.balls[0]; POTION[id].use(s, P, { r, pw: relicFx(r).potionPow });
  if (P.fx.alchemy) for (const a of P.abs) if (a.eff === "brew") a.cd = 0;   // 유물: 연금 순환
  if (auto){ if (s.pops.length < 30) s.pops.push({ x: P.x, y: P.y - P.R - 18, t: 0, txt: POTION[id].icon + "꿀꺽" }); if (s.depth < 3){ s.depth++; fire(s, P, "potion", {}); s.depth--; } }
  else { s.depth = 0; fire(s, P, "potion", {}); }

// ================= 전투 도우미 =================
const other = (s, k) => {   // 이 볼의 '상대'. 플레이어는 가장 가까운 살아있는 적, 적은 플레이어
  if (k.id !== 0) return s.balls[0];
  let best = null, bd = 1e9;
  for (const b of s.balls) if (b.id !== 0 && !b.dead){ const d = Math.hypot(b.x - k.x, b.y - k.y); if (d < bd){ bd = d; best = b; } }
  return best || s.balls[1];
};
const foesOf = (s, k) => k.id === 0 ? s.balls.filter(b => b.id !== 0 && !b.dead) : [s.balls[0]];
const clampPos = k => { k.x = clamp(k.x, k.R, W - k.R); k.y = clamp(k.y, k.R, H - k.R); };
function nearestOf(list, p){ let best = null, bd = 1e9; for (const b of list){ const d = Math.hypot(b.x - p.x, b.y - p.y); if (d < bd){ bd = d; best = b; } } return best; }

// ================= 효과 =================
// 모든 스킬은 me.mod[스킬].pow(위력) / area(범위) / cd(발동 간격)에 영향을 받음
const pw = (me, base, ab) => Math.min(BIG, base * me.atk * (1 + me.atkBonus) / 12 * me.mod[ab.eff].pow * (me.castMul || 1) * (ab.lvMul || 1));
const CHAIN_DECAY = 0.7, CHAIN_WINDOW = 60;   // 같은 스킬을 1초(60틱) 안에 다시 쓰면 그 1초 안에 쓴 횟수만큼 위력 ×0.7 (최저 ×0.34)
// 투사체 스킬: 발동하면 잠깐(0.2초) 멈춰 조준 → 발사 → 발사 반대 방향으로 약한 반동. 상대의 움직임을 예측해서 쏨
const SHOT_AIM = 12, SHOT_RECOIL = 5, SHOT_LEAD = 0.4;
function mkShot(s, me, foe, ab, base, spd, life, homing, r, col){   // (옛 무기용)
  me.shotQ.push({ t: SHOT_AIM, ab, base, spd: spd * ((me.mod[ab.eff] || {}).spd || 1), life, homing, r, col, mul: me.castMul || 1 });
  me.aimT = Math.max(me.aimT, SHOT_AIM);
}
function foeSpeed(f){ return f.frozenT > 0 ? 0 : f.spd * (1 + ACCEL_STEP * (f.accel || 0)) * (f.dashT > 0 ? f.dashMult : 1) * (f.slowT > 0 ? f.slowMult : 1) * (1 - 0.1 * f.chill) * (f.wetT > 0 ? 0.85 : 1) * (f.hasteT > 0 ? f.hasteMult : 1); }
function aimAngle(me, foe, spd){   // 예측 조준 (벽 튕김은 무시)
  const sp = foeSpeed(foe), vx = foe.hx * sp, vy = foe.hy * sp; let tx = foe.x, ty = foe.y;
  for (let i = 0; i < 3; i++){ const t = Math.hypot(tx - me.x, ty - me.y) / spd; tx = clamp(foe.x + vx * t * SHOT_LEAD, 0, W); ty = clamp(foe.y + vy * t * SHOT_LEAD, 0, H); }
  return Math.atan2(ty - me.y, tx - me.x);
}
function releaseShot(s, me, q){
  const foe = other(s, me); if (!foe) return;
  const d = pw(me, q.base, q.ab) * (q.mul || 1);
  s.shotStat.fired++;
  if (s.shots.length >= 40){ s.shots[s.shots.length - 1].dmg = Math.min(BIG, s.shots[s.shots.length - 1].dmg + d * 0.5); return; }
  const a = aimAngle(me, foe, q.spd);
  s.shots.push({ owner: me.id, sk: q.ab.eff, x: me.x + Math.cos(a) * me.R * 0.6, y: me.y + Math.sin(a) * me.R * 0.6, vx: Math.cos(a) * q.spd, vy: Math.sin(a) * q.spd, dmg: d, life: q.life, homing: q.homing, hit: [], bnc: 0, r: q.r, col: q.col });
  if (q.extra) Object.assign(s.shots[s.shots.length - 1], q.extra);
  me.rvx = -Math.cos(a) * SHOT_RECOIL * (q.recoil || 1); me.rvy = -Math.sin(a) * SHOT_RECOIL * (q.recoil || 1);   // 반동
}

      C("[풀무질을 돕는다]  체력 12% 잃기 · 문장 하나 강화 +1", "당신은 땀에 흠뻑 젖도록 풀무를 밀었다. 화로에서 붉은 불씨가 되살아난다.", (r, E) => ({ node: skillPickNode("대장장이가 벌겋게 달군 쇠망치를 들어 올린다.\n\n\"자, 어느 것을 벼릴까?\"", (r2, E2, i) => { E2.hurt(0.12); E2.upSent(i); E2.say("쇠망치가 울릴 때마다 불꽃이 튀었다. 식은 쇠가 다시 숨을 쉬는 것 같았다."); }) })),
      C("[삯을 치른다]  골드 50 · 문장 하나 강화 +1", "대장장이가 돈주머니를 흔들어 보더니 고개를 끄덕인다. \"일꾼보단 손님이 낫지.\"", (r, E) => ({ node: skillPickNode("대장장이가 화로에 석탄을 던져 넣는다.\n\n\"어느 것을 벼릴 건가?\"", (r2, E2, i) => { E2.gold(-50); E2.upSent(i); E2.say("망치질 소리가 한참 이어졌다. 땀을 닦은 대장장이가 만족스레 웃는다."); }) }), needGold(50)),
      C("[떠난다]", "대장장이는 다시 눈을 감았다. \"젊은이는 늘 바쁘지...\"", () => {})] },
  { id: "spring", title: "고요한 샘", from: 2,
    text: "숲 한가운데에서 맑은 샘이 솟고 있다. 수면 위로 희미한 빛이 일렁이고, 물소리가 이상하리만큼 마음을 가라앉힌다.\n\n지친 몸이 저절로 샘 쪽으로 기운다.",
    choices: [
      C("[물을 마신다]  체력 전부 회복", "차가운 물이 목을 타고 내려가자, 온몸의 상처가 거짓말처럼 아물어 갔다.", (r, E) => E.healFull()),
      C("[병에 물을 담는다]  체력 물약 1개", "당신은 맑은 물을 조심스레 병에 담았다. 병 속에서 은빛이 일렁인다.", (r, E) => E.potion("heal")),
      C("[깊이 몸을 담근다]  골드 30 잃기 · 최대 체력 +8%", "물속은 얼어붙을 듯이 차가웠다. 그러나 올라왔을 때, 몸이 한결 단단해진 느낌이었다. 주머니에서 동전 몇 닢이 떠내려갔다.", (r, E) => { E.gold(-30); E.maxHp(0.08); })] },
  { id: "altar", title: "검은 제단", from: 3,
    text: "촛불 하나 없는 어둠 속, 검은 돌 제단 위에 붉은 잉크로 쓴 서약서가 놓여 있다.\n\n\"서명하는 자, 힘을 얻으리라.\"\n\n제단 틈새에서 누군가의 낮은 숨소리가 새어 나온다.",
    choices: [
      C("[서명한다]  전설 유물 1개 · 저주: 피의 서약서(공격력 +4, 전투 후 회복 없음)", "펜 끝이 손가락을 찔렀다. 피로 이름을 적는 순간, 제단이 환희에 찬 신음을 토했다. 손 안에 서늘한 물건이 쥐어지고, 어딘가에서 낄낄거리는 소리가 들렸다.", (r, E) => { E.relic("legend"); E.relic("bloodpact"); }),
      C("[피를 한 방울 바친다]  체력 15% 잃기 · 골드 +120", "제단 위로 떨어진 핏방울이 검은 돌 속으로 스며들었다. 곧 제단 틈에서 금화가 쏟아져 나왔다.", (r, E) => { E.hurt(0.15); E.gold(120); }),
      C("[서약서를 찢는다]  골드 +40", "서약서가 갈라지는 순간, 제단 밑에서 비명이 터졌다. 돌 제단이 무너지고, 잔해 속에서 금화가 굴러 나왔다.", (r, E) => E.gold(40))] },
  { id: "gambler", title: "구석의 도박꾼", from: 2,
    text: "허름한 선술집 구석에서 사내가 은화를 튕기며 웃고 있다.\n\n\"한 판 어때? 딱 반반이야. 운에 맡겨 보라고.\"\n\n튕겨 올린 은화가 촛불 빛에 번쩍였다.",
    choices: [
      C("[골드 50을 건다]  50%: 골드 +120 / 50%: 골드 -50", "", (r, E) => { if (E.chance(0.5)){ E.say("은화가 앞면으로 떨어졌다! 사내가 혀를 차며 금화를 밀어 준다."); E.gold(120); } else { E.say("은화가 뒷면으로 떨어졌다. 사내가 능글맞게 웃으며 판돈을 쓸어 갔다."); E.gold(-50); } }, needGold(50)),
      C("[체력 20%를 건다]  50%: 희귀 이상 유물 / 50%: 체력 20% 잃기", "", (r, E) => { if (E.chance(0.5)){ E.say("\"이런, 이긴 건 자네로군.\" 사내가 품에서 낡은 물건을 꺼내 던져 주었다."); E.relic("rare"); } else { E.say("은화가 뒷면으로 떨어졌다. 사내는 약속대로 당신의 팔뚝을 그었다. 쓰라린 상처가 남는다."); E.hurt(0.2); } }),
      C("[자리를 뜬다]", "\"쯧, 겁쟁이.\" 사내의 비웃음을 뒤로하고 당신은 선술집을 나섰다.", () => {})] },
  { id: "goblin", title: "우는 도깨비", from: 2,
    text: "길모퉁이에서 작은 도깨비가 커다란 보따리를 끌어안고 훌쩍이고 있다.\n\n\"내 보물을... 누가 훔쳐 갈 거예요...\"\n\n눈이 마주치자, 보따리가 꿈틀거렸다.",
    choices: [
      C("[보따리를 열어 본다]  50%: 문장 2개 / 50%: 물려서 체력 15% 잃기", "", (r, E) => { if (E.chance(0.5)){ E.say("보따리 안에는 반짝이는 글귀가 적힌 쪽지들이 가득했다. 도깨비가 눈물을 닦으며 두 개를 내어 준다."); E.randBlock(); E.randBlock(); } else { E.say("보따리에서 튀어나온 무언가가 팔을 콱 물었다! 도깨비는 어느새 사라지고 없다."); E.hurt(0.15); } }),
      C("[달래 준다]  골드 20 · 문장 1개 확정", "당신이 건넨 동전을 보고 도깨비가 활짝 웃는다. \"고마워요, 고마워요!\" 도깨비가 보따리에서 무언가를 꺼내 쥐여 주었다.", (r, E) => { E.gold(-20); E.randBlock(); }, needGold(20)),
      C("[못 본 척한다]", "훌쩍이는 소리가 한참 뒤에서 따라왔지만, 당신은 돌아보지 않았다.", () => {})] },
  { id: "library", title: "금서의 방", from: 3,
    text: "먼지 쌓인 서가 사이, 책상 위에서 네 권의 책이 희미하게 빛나고 있다.\n\n붉은 책, 푸른 책, 검은 책, 그리고 표지가 없는 책.\n\n한 권만 펼칠 수 있을 것 같다.",
    choices: [
      C("[붉은 책]  체력 10% 잃기 · 공격력 +2", "책장을 넘기자 글자들이 피처럼 번져 손등으로 스며들었다. 팔에 힘이 차오른다.", (r, E) => { E.hurt(0.1); E.atk(2); }),
      C("[푸른 책]  골드 30 잃기 · 방어력 +2", "차가운 푸른 글자가 몸을 감싸는 듯했다. 책이 재가 되자 주머니도 가벼워졌다.", (r, E) => { E.gold(-30); E.def(2); }),
      C("[검은 책]  최대 체력 10% 잃기 · 문장 하나 복제", "검은 책은 읽을수록 머리가 지끈거렸다. 하지만 당신은 배웠다 — 무언가를 둘로 만드는 법을.", (r, E) => { E.maxHp(-0.1); return { node: sentPickNode("어느 문장을 둘로 만들까?", (r2, E2, i) => { E2.copy(i); E2.say("같은 글귀가 책장에 한 줄 더 새겨졌다."); }) }; }),
      C("[표지 없는 책]  ???", "", (r, E) => {
        const k = Math.floor(r.rng() * 4);
        if (k === 0){ E.say("백지였다. 그런데 눈을 감자 머릿속에 무언가가 새겨져 있었다."); E.relic("chest"); }
        else if (k === 1){ E.say("책이 비명을 지르며 당신의 손을 물었다. 이게 저주였나 보다."); E.relic("doll"); }
        else if (k === 2){ E.say("책장 사이에서 따뜻한 빛이 번져 나와 몸을 감쌌다."); E.healFull(); }
        else { E.say("한 줄의 문장이 가슴에 새겨졌다. 몸이 가벼워진다."); E.maxHp(0.08); } }),
      C("[덮고 떠난다]", "당신은 책들을 쳐다보다가 방을 나섰다. 뒤에서 책장 넘기는 소리가 났다.", () => {})] },
  { id: "adventurer", title: "쓰러진 모험가", from: 2,
    text: "길가에 모험가 한 명이 쓰러져 있다. 배낭은 반쯤 열려 있고, 가슴이 희미하게 오르내린다.\n\n아직 숨이 붙어 있다. 하지만 오래 버티지는 못할 것 같다.",
    choices: [
      C("[배낭을 뒤진다]  70%: 유물 1개 / 30%: 함정으로 체력 20% 잃기", "", (r, E) => { if (E.chance(0.7)){ E.say("배낭 바닥에서 쓸 만한 물건이 나왔다. 모험가의 숨소리는 더 이상 들리지 않았다."); E.relic("normal"); } else { E.say("배낭끈에 연결된 줄이 당겨지며 숨겨진 독침이 튀어나왔다!"); E.hurt(0.2); } }),
      C("[물약을 먹여 준다]  물약 1개 사용 · 유물 1개", "물약을 삼킨 모험가가 기침하며 눈을 떴다. \"당신이... 살려 줬군. 이거라도 받아 줘.\"", (r, E) => { E.losePotion(); E.relic("chest"); }, needPotion),
      C("[장례를 치러 준다]  최대 체력 +5%", "당신은 모험가를 양지바른 곳에 묻어 주었다. 이상하게도 마음이 가벼워졌다.", (r, E) => E.maxHp(0.05)),
      C("[지나친다]", "당신은 시선을 돌리고 걸음을 옮겼다. 등 뒤의 숨소리가 점점 멀어진다.", () => {})] },
  { id: "mirror", title: "거울의 방", from: 4,
    text: "벽 전체가 거울이다. 그 속에, 당신과 똑같은 볼이 서 있다.\n\n거울 속의 볼이 먼저 한 발짝 다가온다. 당신의 문장을 모두 알고 있는 눈빛으로.",
    choices: [
      C("[맞선다]  정예 전투 (승리하면 정예 보상)", "거울이 산산이 갈라지고, 그 속에서 낯선 그림자가 튀어나왔다!", (r, E) => ({ fight: "elite" })),
      C("[거울을 깬다]  체력 10% 잃기 · 골드 +60", "주먹으로 거울을 내리쳤다. 유리 조각이 손을 베었지만, 파편 사이에서 금화가 반짝였다.", (r, E) => { E.hurt(0.1); E.gold(60); }),
      C("[등을 돌린다]", "당신은 거울을 보지 않고 방을 나섰다. 등 뒤에서 누군가 따라 나오는 듯한 기분이 들었다.", () => {})] },
  { id: "mushroom", title: "형광 버섯", from: 2,
    text: "축축한 동굴 벽에 푸르게 빛나는 버섯이 빽빽하게 자라 있다. 달콤한 냄새가 난다.\n\n먹어도 될까...?",

      C("[지나친다]", "달콤한 냄새가 자꾸 코를 간질였지만, 당신은 꾹 참고 지나갔다.", () => {})] },
  { id: "elements", title: "다섯 개의 석상", from: 3,
    text: "원형 광장에 다섯 개의 석상이 둘러서 있다. 칼, 활, 불꽃, 번개, 얼음을 쥔 모습이다.\n\n석상들이 낮게 울리며 손길을 기다린다. 한 석상에만 손을 얹을 수 있을 것 같다.",
    choices: [["blade", "칼을 쥔 석상", "날카로운 쇳소리가 손바닥을 타고 올라왔다."], ["proj", "활을 쥔 석상", "시위가 당겨지는 소리가 귓가에 울렸다."], ["fire", "불꽃을 쥔 석상", "손바닥이 달아오르며 불씨가 피어올랐다."], ["elec", "번개를 쥔 석상", "온몸의 털이 곤두서며 푸른 불꽃이 튀었다."], ["ice", "얼음을 쥔 석상", "손끝에서 서리가 퍼지며 숨결이 하얗게 얼었다."]]

  { id: "door", title: "봉인된 문", from: 3, ok: r => r.deck.length > 1,

  { id: "copier", title: "복제의 거울", from: 3,

function ownedSkills(r){ return r.inv.filter(b => BLK[b.id].k === "t" && BLK[b.id].skill).map(b => BLK[b.id].skill); }
function scoreBlock(r, id){
  const b = BLK[id], sk = ownedSkills(r), atkCnt = sk.filter(x => SKILL[x].g === "공격").length;
  if (b.k === "t"){ if (!b.skill) return 0.4; const g = SKILL[b.skill].g; if (g === "공격") return atkCnt < 3 ? 3 : 1.5; return b.skill === "atk" ? 1.8 : g === "방해" ? 1.4 : 1; }
  if (b.k === "a") return sk.some(x => SKILL[x].g === "공격" && modFits(b.mod, x)) ? 2.5 : 0.3;
  if (b.k === "s" || b.k === "v") return 1.6;
  if (b.trig === "effect") return sk.includes(b.tp) ? 2 : 0.3;
  if (b.trig === "attrhit") return sk.some(x => SKILL[x].attrs.includes(b.tp)) ? 1.8 : 0.2;

      const cs = castSkills(i), acts = freeBlocks(r).filter(b => BLK[b.id].k === "a"), ts = freeBlocks(r).filter(b => BLK[b.id].k === "t"), opts = [];
      for (const a of acts) for (const t of ts){ const sk = BLK[t.id].skill; if (cs.includes(sk) && modFits(BLK[a.id].mod, sk) && (!smart || SKILL[sk].g === "공격")) opts.push({ a, t }); }

      const free = freeBlocks(r), comps = free.filter(b => BLK[b.id].k === "w"), subs = free.filter(b => BLK[b.id].k === "s"), vs = free.filter(b => BLK[b.id].k === "v"), opts = comps.map(b => ({ w: b, sc: scoreBlock(r, b.id) }));

function botEvent(r, rng){   // 봇: 이벤트를 무작위 선택으로 진행. 전투가 시작되면 그 종류를 돌려줌

}

function v2Steal(s, me, n){ const r = runState, a = Math.min(n, r.gold || 0); if (a <= 0) return; r.gold -= a; me.stolen = (me.stolen || 0) + a; popS(s, me.x, me.y - me.R - 30, `💰-${a}`); updateHud(); }
function v2Escape(s, me){ me.escaped = true; me.dead = true; me.hp = 0; s.booms.push({ x: me.x, y: me.y, r: 40, t: 0, col: "#aaa" }); popS(s, me.x, me.y - me.R - 14, "💨도망!"); }
// 조합 (가중치)
const ENC1 = {
  easy: [[2, () => ["jaw"]], [2, () => ["cultist"]], [2, r => [r.rng() < 0.5 ? "louseR" : "louseG", r.rng() < 0.5 ? "louseR" : "louseG"]], [2, r => r.rng() < 0.5 ? ["spikeM", "acidS"] : ["acidM", "spikeS"]]],
  hard: [[2, r => [r.rng() < 0.5 ? "acidL" : "spikeL"]], [1, () => ["spikeS", "spikeS", "spikeS", "acidS", "acidS"]], [2, () => ["slaverB"]], [1, () => ["slaverR"]],
    [2, r => [0, 1, 2].map(() => r.rng() < 0.5 ? "louseR" : "louseG")], [2, () => ["fungi", "fungi"]], [2, () => ["looter"]],
    [1, r => { const pool = ["gFat", "gFat", "gSneak", "gSneak", "gMad", "gMad", "gShield", "gWiz"]; const out = []; while (out.length < 4) out.push(pool.splice(Math.floor(r.rng() * pool.length), 1)[0]); return out; }],
    [1.5, r => [[r.rng() < 0.5 ? "louseR" : "louseG", "acidM", "spikeM"][Math.floor(r.rng() * 3)], ["slaverB", "slaverR", "cultist", "looter"][Math.floor(r.rng() * 4)]]],
    [1.5, r => [r.rng() < 0.5 ? "fungi" : "jaw", [r.rng() < 0.5 ? "louseR" : "louseG", "acidM", "spikeM"][Math.floor(r.rng() * 3)]]]],
  elite: [[1, () => ["nob"]], [1, () => ["laga"]], [1, () => ["sentry", "sentry", "sentry"]]],
  boss: [[1, () => ["slimeK"]], [1, () => ["guardian"]], [1, () => ["hexa"]]]
};
function mkMon(id, r, slot){ const M = MON[id], hp = Array.isArray(M.hp) ? M.hp[0] + Math.floor(r.rng() * (M.hp[1] - M.hp[0] + 1)) : M.hp;
  return { mon: id, tid: M.art, slot, hp, maxHp: hp, atk: 12, def: 0, minI: MIN_INTERVAL, name: M.name, icon: M.icon, color: M.color, ring: M.boss ? "#d08aff" : M.elite ? "#ffb040" : "#fff",
    tag: M.boss ? "boss" : M.elite ? "elite" : "normal", R: M.R || 22, abilities: [], spikes: 0, attrs: [], weak: [], resist: [], v2effs: [] }; }
function genAct1(r, kind){
  const pickE = (list, bad) => { const ok = list.map((x, i) => [x, i]).filter(([x, i]) => !bad.includes(i)); const tot = ok.reduce((a, [x]) => a + x[0], 0); let v = r.rng() * tot; for (const [x, i] of ok){ v -= x[0]; if (v <= 0) return [x, i]; } return ok[ok.length - 1]; };
  if (kind === "boss"){ if (r.act1Boss == null) r.act1Boss = Math.floor(r.rng() * 3); return ENC1.boss[r.act1Boss][1](r).map((id, i) => mkMon(id, r, i)); }
  if (kind === "elite"){ const [x, i] = pickE(ENC1.elite, r.lastElite1 != null ? [r.lastElite1] : []); r.lastElite1 = i; return x[1](r).map((id, k) => mkMon(id, r, k)); }
  r.n1 = (r.n1 || 0) + 1; const pool = r.n1 <= 3 ? "easy" : "hard", hist = (r.hist1 || []).filter(h => h[0] === pool).slice(-2).map(h => h[1]);
  const [x, i] = pickE(ENC1[pool], hist); r.hist1 = (r.hist1 || []).concat([[pool, i]]).slice(-4); return x[1](r).map((id, k) => mkMon(id, r, k));
}
const genEncounter0 = genEncounter;
genEncounter = function(r, kind){ if (r.v2 && actOf(r.floor) === 1) return genAct1(r, kind); return genEncounter0(r, kind); };

// ---- 전투 연결 ----
function v2MonInit(s, e){ const M = e.cfg && MON[e.cfg.mon]; if (!M || e.monInit) return; e.monInit = true; e.mem = { n: 0, hist: [] }; if (M.init) M.init(e, s); }
const startFightV2m = startFightV2;
startFightV2 = function(r){ const s = startFightV2m(r); s.balls.slice(1).forEach(e => v2MonInit(s, e)); return s; };
function v2MonPattern(s, e){   // 이번 라운드 패턴 고르기 (잠·기절이면 빈 패턴)
  const M = MON[e.cfg.mon], m = e.mem;
  if (e.stunNext){ e.stunNext = false; popS(s, e.x, e.y - e.R - 26, "💫기절"); return { len: 10, ev: [] }; }   // 잠에서 맞아 깬 라운드 다음: 기절
  if (e.asleep > 0){ e.asleep--; if (e.asleep === 0) e.wakeNext = true; return { len: 10, ev: [] }; }   // 잠: asleep 라운드 동안 행동 없음
  if (e.wakeNext){ e.wakeNext = false; v2Wake(s, e, false); }
  const pi = M.order(e, s, m); m.hist.push(pi); m.n++; return M.pats[pi];
}
function v2Wake(s, e, hit){ e.asleep = 0; e.wakeNext = false; e.metal = 0; e.spd = e.spd0 || 3.5; popS(s, e.x, e.y - e.R - 26, "❗깨어남"); if (hit){ v2CancelEvs(s, e); e.stunNext = true; } }
function v2Split(s, e){   // 분열: 남은 체력을 각자 가진 둘로
  const M = MON[e.cfg.mon], h = Math.max(1, Math.round(e.hp)), [a, b] = M.split, r = runState;
  const mk = id => { const c = mkMon(id, r, 0); c.hp = c.maxHp = h; return c; };
  const ca = mk(a); Object.assign(e, { cfg: { ...e.cfg, ...ca }, hp: h, maxHp: h, R: ca.R, name: ca.name, color: ca.color, monInit: false, ring: ca.ring, shieldHp: 0 }); e.cfg.mon = a; v2MonInit(s, e);
  const nb = newBall(s.balls.length, clamp(e.x + 30, 20, W - 20), e.y, s.rng() * 6.28, mk(b)); s.balls.push(nb); v2MonInit(s, nb);
  s.booms.push({ x: e.x, y: e.y, r: 50, t: 0, col: "#5ad07a" }); popS(s, e.x, e.y - e.R - 26, "🟢분열!");
}
// 맞을 때: 웅크리기·분노(맞으면 힘)·잠 깨기·수호자 모드·가시
const hurtV2 = hurt;
hurt = function(s, tgt, src, amount, sk){
  const hp0 = tgt.hp; const res = hurtV2(s, tgt, src, amount, sk); const dealt = Math.max(0, hp0 - tgt.hp);
  if (s.v2 && src && src.id === 0 && tgt.id !== 0 && src.vulnHit && sk === "stick" && s.tick <= src.vulnHit.until && tgt.hp > 0){ v2Debuff(s, tgt, "vulnR", src.vulnHit.n); src.vulnHit = null; }   // 강타: 맞힌 적에게 취약
  if (s.v2 && tgt.id !== 0 && src && src.id === 0 && !tgt.dead){
    if (tgt.curl && dealt > 0){ const c = tgt.curl; tgt.curl = 0; v2Shield(s, tgt, c); popS(s, tgt.x, tgt.y - tgt.R - 30, "🐚웅크리기"); }
    if (tgt.angry && dealt > 0) v2Str(s, tgt, tgt.angry);
    if (tgt.asleep > 0 && dealt > 0) v2Wake(s, tgt, true);
    if (tgt.mode === "atk" && dealt > 0){ tgt.modeDmg += dealt; if (tgt.modeDmg >= tgt.modeThr){ tgt.mode = "def"; tgt.mem.dn = 0; tgt.modeThr += 10; tgt.v2thorns = 4; v2Shield(s, tgt, 20); v2CancelEvs(s, tgt); popS(s, tgt.x, tgt.y - tgt.R - 30, "🛡방어 모드!"); } }
    const M = tgt.cfg && MON[tgt.cfg.mon]; if (M && M.split && !tgt.splitReady && tgt.hp > 0 && tgt.hp <= tgt.maxHp / 2){ tgt.splitReady = true; v2CancelEvs(s, tgt); popS(s, tgt.x, tgt.y - tgt.R - 30, "🟢분열 준비"); }
    if (tgt.v2thorns && !src.dead && sk !== "thorn"){ src.hp -= tgt.v2thorns; popS(s, src.x, src.y - src.R - 8, "🌵" + tgt.v2thorns); }
  }
  return res;
};
// 라운드 준비 연결: 패턴 고르기 전에 분열, 적 의식(라운드마다 힘)
const v2PrepRoundM = v2PrepRound;
v2PrepRound = function(s){
  for (const e of s.balls.slice(1)) if (!e.dead && e.splitReady && e.cfg && MON[e.cfg.mon] && MON[e.cfg.mon].split){ e.splitReady = false; v2Split(s, e); }
  for (const e of s.balls.slice(1)) if (!e.dead && e.ritualN && e.mem && e.mem.n > 0) v2Str(s, e, e.ritualN);
  return v2PrepRoundM(s);
};
// 죽음·도망 처리 (매 틱)
function v2MonTick(s){
  const r = runState;
  for (const e of s.balls.slice(1)) if (e.dead && !e.deathDone){ e.deathDone = true; const M = e.cfg && MON[e.cfg.mon];
    if (!e.escaped){ if (e.stolen){ r.gold += e.stolen; popS(s, e.x, e.y - e.R - 30, `💰+${e.stolen}`); updateHud(); } if (M && M.onDeath) M.onDeath(s, e); } }
}
// 내가 카드를 낼 때(분노: 스킬)
function v2OnCardPlayed(s, C){ if (C.type === "skill") for (const e of s.balls.slice(1)) if (!e.dead && e.enrage){ v2Str(s, e, e.enrage); popS(s, e.x, e.y - e.R - 30, "😠분노"); } }

// ---- 🛠 몬스터 고르기 (1막) ----
function v2OpenMonPicker(){ const r = runState; if (!r) return;
  const groups = [["쉬운 풀", ENC1.easy], ["어려운 풀", ENC1.hard], ["정예", ENC1.elite], ["보스", ENC1.boss]];
  const label = f => { const ids = f({ rng: () => 0.3 }); return ids.map(id => MON[id].icon + MON[id].name).join(" + "); };
  openInfo("🛠 1막 몬스터 고르기", groups.map(([g, list], gi) => `<div class="sideh" style="margin-top:6px">${g}</div><div class="caGrid">${list.map((x, i) => `<button class="caChip" data-mg="${gi}" data-mi="${i}">${label(x[1])}</button>`).join("")}</div>`).join(""), el => {
    el.querySelectorAll("[data-mg]").forEach(b => b.onclick = () => { const [, list] = groups[+b.dataset.mg], x = list[+b.dataset.mi];
      r.enc = x[1](r).map((id, k) => mkMon(id, r, k)); r.encKind = MON[r.enc[0].mon].boss ? "boss" : MON[r.enc[0].mon].elite ? "elite" : "normal"; r.retry = 0; closeInfo(); state = null; renderPrep(); }); }); }
{ const row = document.querySelector("#devbox .row"); if (row){ const b = document.createElement("button"); b.className = "dbg"; b.textContent = "🛠 1막 몬스터"; b.onclick = () => setTimeout(v2OpenMonPicker, 30); row.insertBefore(b, row.firstChild); } }
function v2Blocked(s, id){ const C = CD(id); if (C.unplayable) return `${C.icon} ${C.name}: 사용할 수 없는 카드예요`; if (C.type === "atk" && s.balls[0].entangleR > 0) return "🕸 속박: 이번 라운드엔 공격 카드를 못 올려요"; return ""; }
const stepMon = step;
step = function(s){ stepMon(s); if (s.v2) v2MonTick(s); };
const newRunMon = newRun;
newRun = function(seed){ const r = newRunMon(seed); beginFloor(r, "normal"); return r; };

// ===== (v2.23) 적 행동 자세히 보기: 타임라인의 적 행동을 누르면 창으로 =====
const MON_NOTE = {
  louseR: "🐚 몸 말기 5 — 처음 피해를 입으면 보호막 5 (1번)", louseG: "🐚 몸 말기 5 — 처음 피해를 입으면 보호막 5 (1번)",
  acidL: "🟢 분열 — 체력이 절반 이하가 되면 하던 행동을 멈추고, 다음 라운드에 산성 슬라임(중) 2마리로 갈라짐 (각자 남은 체력)",
  spikeL: "🟣 분열 — 체력이 절반 이하가 되면 다음 라운드에 가시 슬라임(중) 2마리로 갈라짐 (각자 남은 체력)",
  slimeK: "👑 분열 — 체력이 절반 이하가 되면 다음 라운드에 산성(대)+가시(대)로 갈라짐 (각자 남은 체력)",
  fungi: "🍄 죽을 때 포자 — 쓰러지면 나에게 💔취약 2", looter: "💰 강탈한 골드는 쓰러뜨리면 돌려받음. 4번째 라운드에 도망",
  gMad: "😡 분노 1 — 피해를 입을 때마다 힘 +1", gShield: "동료가 있으면 동료에게 보호막, 혼자 남으면 직접 공격",
  gWiz: "충전 2번 → 궁극 화염 25 (집중 2초 동안 끊으면 취소)", nob: "😠 고함 이후 격분 — 내가 스킬 카드를 낼 때마다 힘 +2 (공격 카드는 괜찮음)",
  laga: "💤 처음 3라운드 잠 (금속화 8: 라운드마다 보호막 8). 맞아서 깨면 다음 라운드는 기절. 깨면 금속화 사라짐",
  sentry: "🔷 인공물 1 — 해로운 효과 1번 무효. 양쪽은 볼트부터, 가운데는 빔부터 번갈아",
  guardian: "⚙ 공격 모드에서 피해 20을 받으면 방어 모드(보호막 20, 🌵가시 4: 때리면 나도 4 피해). 방어 모드 2라운드 뒤 공격 모드로, 문턱 +10",
  hexa: "첫 라운드 활성 → 분할(내 체력 비례 6연타) → 이후 7가지 행동 순환. 🔥화상 카드를 계속 섞음",
  cultist: "첫 라운드에 의식 → 그 다음부터 라운드마다 힘 +3"
};
function v2EvHtml(e, v, P){
  const ty = actType(v.sk), S = SKILL[v.sk] || {}, M2 = S.v2, i = evInfo(e, v.sk, P), tyN = { atk: "공격", skill: "스킬", power: "파워" }[ty];
  const dodge = M2 ? (i.d != null ? (i.tg ? "🎯 확정 — 피할 수 없음. 보호막으로 막거나, 정신집중 중에 직접 공격해서 끊어야 함" : "↗ 논타겟팅 — 움직임(빈 시간)으로 피할 수 있음") : "")
    : (EV_BASE[v.sk] != null || v.sk === "freeze" ? (EV_TARGET.has(v.sk) ? "🎯 타겟팅 — 피할 수 없음, 막거나 끊어야 함" : "↗ 논타겟팅 — 움직임으로 피할 수 있음") : "");
  return `<div style="font-size:14px"><b>${e.icon || ""} ${e.name} — ${S.label || v.sk}</b> <span class="evc ${ty}">${tyN}</span></div>
    <div class="small" style="margin-top:4px">📜 <b>효과:</b> ${S.desc || "-"}</div>
    ${i.d != null ? `<div class="small">⚔ <b>지금 맞으면:</b> ${Math.max(1, Math.round(i.d))}${i.n > 1 ? ` × ${i.n}번 = ${Math.max(1, Math.round(i.d)) * i.n}` : ""}${EV_PER[v.sk] || ""} <span style="opacity:.7">(적 힘·약화, 내 취약·방어 반영)</span></div>` : ""}
    ${dodge ? `<div class="small">${dodge}</div>` : ""}
    <div class="small">⏱ ${(v.t - v.f).toFixed(1)}초부터 정신집중 ${v.f}초 → <b>${v.t}초에 발동</b> · 집중 중에 내 직접 공격에 맞으면 😵좌절(취소)</div>
    ${e.cfg && MON_NOTE[e.cfg.mon] ? `<div class="small" style="color:#ffd27a">특성: ${MON_NOTE[e.cfg.mon]}</div>` : ""}`;
}
function v2ShowEv(e, v){ openInfo("적 행동", v2EvHtml(e, v, state.balls[0])); }

{ const sv = loadGame(); if (sv){ runState = sv.r; state = null; prepNote = `💾 ${sv.r.floor}층 이어하기`; if (sv.where === "route") renderRoute(); else renderPrep(); } else newGame(); }
requestAnimationFrame(loop);
</script>
